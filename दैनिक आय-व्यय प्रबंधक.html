<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>दैनिक आय-व्यय प्रबंधक</title>
<!-- Chosen Palette: Slate & Emerald Neutral -->
<!-- Application Structure Plan: Simple single-page dashboard structure designed for instant mobile tracking. Features top summary cards (Income, Expense, Balance), quick-add buttons (+20, +50, +100, +500), input form with category/payment mode selectors, filterable transaction list, Chart.js donut chart for expense breakdown, CSV export, and WhatsApp report sharing. -->
<!-- Visualization & Content Choices: Transaction Data -> Visual Breakdown -> Chart.js Donut Chart (Canvas) -> Dynamic Update -> Easy visual analysis without SVG/Mermaid. -->
<!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body { background-color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  .chart-container { position: relative; width: 100%; max-width: 320px; margin-left: auto; margin-right: auto; height: 220px; max-height: 240px; }
</style>
</head>
<body class="p-3 sm:p-5 text-slate-800 max-w-md mx-auto min-h-screen flex flex-col justify-between">

  <div>
    <!-- Header -->
    <header class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 mb-4 text-center">
      <h1 class="text-xl font-bold text-slate-800">दैनिक आय-व्यय प्रबंधक</h1>
      <p class="text-xs text-slate-5-0 text-slate-500 mt-1">आपका सुरक्षित एवं सरल डिजिटल बहीखाता</p>
    </header>

    <!-- Overall Summary -->
    <section class="grid grid-cols-3 gap-2 mb-4">
      <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-3 text-center">
        <span class="text-xs text-emerald-700 block font-medium">कुल आय</span>
        <strong id="tInc" class="text-base sm:text-lg text-emerald-800 font-bold">₹0</strong>
      </div>
      <div class="bg-rose-50 border border-rose-200 rounded-xl p-3 text-center">
        <span class="text-xs text-rose-700 block font-medium">कुल व्यय</span>
        <strong id="tExp" class="text-base sm:text-lg text-rose-800 font-bold">₹0</strong>
      </div>
      <div class="bg-sky-50 border border-sky-200 rounded-xl p-3 text-center">
        <span class="text-xs text-sky-700 block font-medium">शेष राशि</span>
        <strong id="tBal" class="text-base sm:text-lg text-sky-800 font-bold">₹0</strong>
      </div>
    </section>

    <!-- New Entry Form -->
    <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 mb-4 space-y-3">
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-xs font-semibold text-slate-600 mb-1 block">लेनदेन का प्रकार</label>
          <select id="type" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-medium focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="व्यय">व्यय (खर्च -)</option>
            <option value="आय">आय (जमा +)</option>
          </select>
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-600 mb-1 block">भुगतान माध्यम</label>
          <select id="mode" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-medium focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="Cash">नकद (Cash)</option>
            <option value="UPI">UPI / ऑनलाइन</option>
            <option value="Bank">बैंक</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-xs font-semibold text-slate-600 mb-1 block">राशि (₹)</label>
          <input type="number" id="amt" placeholder="0" inputmode="numeric" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-semibold focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-600 mb-1 block">श्रेणी (Category)</label>
          <select id="cat" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-medium focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="चाय-नाश्ता">चाय-नाश्ता</option>
            <option value="किराना/भोजन">किराना/भोजन</option>
            <option value="पेट्रोल/वाहन">पेट्रोल/वाहन</option>
            <option value="दूध/डेयरी">दूध/डेयरी</option>
            <option value="व्यापार/दुकान">व्यापार/दुकान</option>
            <option value="अन्य">अन्य</option>
          </select>
        </div>
      </div>

      <!-- Quick Add Buttons -->
      <div>
        <span class="text-xs font-semibold text-slate-500 mb-1 block">त्वरित राशि जोड़ें:</span>
        <div class="flex gap-2">
          <button type="button" onclick="addAmt(20)" class="flex-1 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-lg transition">+₹20</button>
          <button type="button" onclick="addAmt(50)" class="flex-1 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-lg transition">+₹50</button>
          <button type="button" onclick="addAmt(100)" class="flex-1 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-lg transition">+₹100</button>
          <button type="button" onclick="addAmt(500)" class="flex-1 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-lg transition">+₹500</button>
        </div>
      </div>

      <div>
        <label class="text-xs font-semibold text-slate-600 mb-1 block">विवरण (नोट)</label>
        <input type="text" id="note" placeholder="विवरण लिखें (वैकल्पिक)" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <button onclick="saveEntry()" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow transition active:scale-95 text-sm">
        प्रविष्टि जोड़ें (Save)
      </button>

      <div class="grid grid-cols-2 gap-2 pt-1">
        <button onclick="shareWA()" class="py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl text-xs transition">
          WhatsApp रिपोर्ट
        </button>
        <button onclick="exportCSV()" class="py-2 bg-slate-700 hover:bg-slate-800 text-white font-semibold rounded-xl text-xs transition">
          Excel (CSV) डाउनलोड
        </button>
      </div>
    </section>

    <!-- Expense Graph Breakdown -->
    <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 mb-4">
      <h2 class="text-sm font-bold text-slate-700 mb-2 text-center">खर्च का विश्लेषणात्मक ग्राफ</h2>
      <div class="chart-container">
        <canvas id="expenseChart"></canvas>
      </div>
    </section>

    <!-- Recent Transactions List -->
    <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 mb-6">
      <h2 class="text-sm font-bold text-slate-700 mb-3 pb-2 border-b border-slate-100">हाल के लेनदेन</h2>
      <div id="list" class="space-y-2 max-h-64 overflow-y-auto"></div>
    </section>
  </div>

  <footer class="text-center text-xs text-slate-400 py-2">
    100% सुरक्षित • ऑफ़लाइन समर्थित • बिना लॉगिन के
  </footer>

<script>
  let data = JSON.parse(localStorage.getItem('hisab_data') || '[]');
  let chartInstance = null;

  function addAmt(v) {
    let el = document.getElementById('amt');
    el.value = (Number(el.value) || 0) + v;
  }

  function saveEntry() {
    let amt = Number(document.getElementById('amt').value);
    if (!amt || amt <= 0) return alert('कृपया वैध राशि दर्ज करें');
    
    let entry = {
      id: Date.now(),
      date: new Date().toLocaleDateString('hi-IN'),
      type: document.getElementById('type').value,
      mode: document.getElementById('mode').value,
      cat: document.getElementById('cat').value,
      note: document.getElementById('note').value.trim() || '-',
      amt: amt
    };
    
    data.unshift(entry);
    localStorage.setItem('hisab_data', JSON.stringify(data));
    document.getElementById('amt').value = '';
    document.getElementById('note').value = '';
    render();
  }

  function delEntry(id) {
    if(confirm('क्या आप इस प्रविष्टि को हटाना चाहते हैं?')) {
      data = data.filter(x => x.id !== id);
      localStorage.setItem('hisab_data', JSON.stringify(data));
      render();
    }
  }

  function renderChart(categoryTotals) {
    const ctx = document.getElementById('expenseChart').getContext('2d');
    const labels = Object.keys(categoryTotals);
    const chartData = Object.values(categoryTotals);

    if (chartInstance) {
      chartInstance.destroy();
    }

    if (labels.length === 0) {
      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['कोई खर्च नहीं'],
          datasets: [{ data: [1], backgroundColor: ['#cbd5e1'] }]
        },
        options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
      });
      return;
    }

    chartInstance = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: labels,
        datasets: [{
          data: chartData,
          backgroundColor: ['#f43f5e', '#3b82f6', '#eab308', '#10b981', '#8b5cf6', '#64748b']
        }]
      },
      options: {
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } }
        }
      }
    });
  }

  function render() {
    let inc = 0, exp = 0, html = '';
    let categoryTotals = {};

    data.forEach(x => {
      if (x.type === 'आय') {
        inc += x.amt;
      } else {
        exp += x.amt;
        categoryTotals[x.cat] = (categoryTotals[x.cat] || 0) + x.amt;
      }

      let colorClass = x.type === 'आय' ? 'text-emerald-700' : 'text-rose-700';
      let sign = x.type === 'आय' ? '+' : '-';

      html += `<div class="flex justify-between items-center p-2.5 bg-slate-50 rounded-xl border border-slate-100">
        <div>
          <div class="text-xs font-bold text-slate-800">${x.cat} <span class="font-normal text-slate-500">(${x.note})</span></div>
          <div class="text-[11px] text-slate-400 mt-0.5">${x.date} • ${x.mode}</div>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-sm font-extrabold ${colorClass}">${sign}₹${x.amt}</span>
          <button onclick="delEntry(${x.id})" class="text-xs bg-rose-100 text-rose-700 hover:bg-rose-200 px-2 py-1 rounded-md font-semibold transition">हटाएँ</button>
        </div>
      </div>`;
    });

    document.getElementById('tInc').innerText = '₹' + inc;
    document.getElementById('tExp').innerText = '₹' + exp;
    document.getElementById('tBal').innerText = '₹' + (inc - exp);
    document.getElementById('list').innerHTML = html || '<p class="text-center text-xs text-slate-400 py-4">अभी तक कोई लेनदेन नहीं जोड़ा गया है</p>';

    renderChart(categoryTotals);
  }

  function shareWA() {
    let inc = document.getElementById('tInc').innerText;
    let exp = document.getElementById('tExp').innerText;
    let bal = document.getElementById('tBal').innerText;
    let text = `*दैनिक आय-व्यय रिपोर्ट*\nकुल आय: ${inc}\nकुल व्यय: ${exp}\nशेष राशि: ${bal}\n\n*हाल की प्रविष्टियाँ:*\n`;
    data.slice(0, 10).forEach(x => {
      text += `• ${x.date}: ${x.type} ₹${x.amt} (${x.cat} - ${x.note})\n`;
    });
    window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
  }

  function exportCSV() {
    if (data.length === 0) return alert('निर्यात (Export) के लिए कोई डेटा नहीं है');
    let csv = 'दिनांक,प्रकार,माध्यम,श्रेणी,विवरण,राशि\n';
    data.forEach(x => { csv += `${x.date},${x.type},${x.mode},${x.cat},"${x.note}",${x.amt}\n`; });
    let blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
    let a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'Daily_Hisab.csv';
    a.click();
  }

  render();
</script>
</body>
</html>
