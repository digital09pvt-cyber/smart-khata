name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Web Directory & Capacitor
        run: |
          export CAPACITOR_NO_TELEMETRY=1
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          node -e "const fs = require('fs'); fs.writeFileSync('capacitor.config.json', JSON.stringify({appId: 'com.smartkhata.app', appName: 'SmartKhata', webDir: 'www', bundledWebRuntime: false}, null, 2));"
          npx cap add android
          npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SmartKhata-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
          
